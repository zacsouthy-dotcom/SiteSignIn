<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follow Us — The Gypsy Fair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #0f0a16;
    --card-bg: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.1);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.62);
    --text-dimmer: rgba(255,255,255,0.42);
    --accent: #b488e0;
    --accent-grad: linear-gradient(135deg,#a855d9,#6a1fb0);
    --gold: #e8b84b;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f2fb; --card-bg: #ffffff; --card-border: rgba(107,30,170,0.12);
      --text: #2a1540; --text-dim: rgba(42,21,64,0.64); --text-dimmer: rgba(42,21,64,0.46);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0a16; --card-bg: rgba(255,255,255,0.05); --card-border: rgba(255,255,255,0.1);
    --text: #ffffff; --text-dim: rgba(255,255,255,0.62); --text-dimmer: rgba(255,255,255,0.42);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { min-height:100%; background: var(--bg); font-family:'Inter',-apple-system,sans-serif; }
  body {
    display:flex; align-items:center; justify-content:center;
    padding: 32px 20px calc(32px + env(safe-area-inset-bottom,0px));
  }

  .grid { position:fixed; inset:-60px; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(180,136,224,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,136,224,0.08) 1px, transparent 1px);
    background-size:44px 44px; }
  .glow { position:fixed; top:-220px; right:-220px; width:620px; height:620px; z-index:0; pointer-events:none;
    background: radial-gradient(circle, rgba(154,56,214,0.4) 0%, rgba(154,56,214,0) 70%); }
  .glow2 { position:fixed; bottom:-260px; left:-260px; width:620px; height:620px; z-index:0; pointer-events:none;
    background: radial-gradient(circle, rgba(232,184,75,0.22) 0%, rgba(232,184,75,0) 70%); }

  .card {
    position:relative; z-index:1; width:100%; max-width:420px;
    background: var(--card-bg); border:1px solid var(--card-border); border-radius:28px;
    padding:40px 30px 30px; backdrop-filter: blur(10px); text-align:center;
    box-shadow: 0 30px 80px rgba(80,20,130,0.25);
  }

  .biz-avatar {
    width:128px; height:128px; border-radius:50%; margin:0 auto 20px;
    background: var(--accent-grad); display:flex; align-items:center; justify-content:center;
    overflow:hidden; border:3px solid rgba(232,184,75,0.55);
    box-shadow: 0 0 0 6px rgba(154,56,214,0.12);
  }
  .biz-avatar img { width:100%; height:100%; object-fit:cover; }

  .biz-name { font-size:27px; font-weight:800; color: var(--text); margin-bottom:6px; letter-spacing: -0.3px; }
  .biz-sub { font-size:14px; color: var(--gold); font-weight:700; letter-spacing: 1.5px; text-transform:uppercase; margin-bottom:28px; }

  .follow-tag {
    display:inline-block; background: rgba(168,85,217,0.16); color: var(--accent);
    border:1px solid rgba(168,85,217,0.45); font-size:13px; font-weight:800; letter-spacing:1.5px;
    text-transform:uppercase; padding:8px 20px; border-radius:999px; margin-bottom:26px;
  }

  .link-list { display:flex; flex-direction:column; gap:14px; margin-bottom: 28px; }
  .link-btn {
    display:flex; align-items:center; gap:14px; width:100%;
    background: rgba(168,85,217,0.07); border:1px solid var(--card-border); border-radius:16px;
    padding:16px 18px; text-decoration:none; transition: transform .15s ease;
  }
  .link-btn:active { transform: scale(0.97); }
  .link-icon {
    width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .link-icon svg { width:22px; height:22px; }
  .ig { background: linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
  .fb { background:#1877f2; }
  .tt { background:#17140f; border:1px solid rgba(255,255,255,0.15); }
  .link-text { text-align:left; flex:1; }
  .link-platform { font-size:16px; font-weight:700; color: var(--text); }
  .link-handle { font-size:13px; color: var(--text-dimmer); margin-top:1px; }
  .link-arrow { color: var(--text-dimmer); font-size:18px; }

  .footer { margin-top:8px; font-size:13px; color: var(--text-dimmer); display:flex; align-items:center; justify-content:center; gap:6px; }
  .footer svg { width:14px; height:14px; }
  .footer b { color: var(--accent); }
</style>
</head>
